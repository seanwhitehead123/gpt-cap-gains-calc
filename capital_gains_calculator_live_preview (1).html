<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capital Gains Tax Calculator (2025 update)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media (max-width: 768px) {
      input[type=range] {
        width: 100% !important;
      }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-4xl mx-auto p-6">
    <section class="bg-white rounded-2xl shadow p-6 space-y-6">
      <header>
        <h1 class="text-2xl font-bold mb-2">Capital Gains Tax Calculator</h1>
      </header>

      <!-- Inputs -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <label class="block">
          <span class="text-sm font-medium">Purchase price / Basis ($)</span>
          <input id="purchase" type="text" inputmode="numeric" value="500,000" class="mt-1 w-full rounded-lg border border-gray-300 p-3" />
          <input id="purchaseSlider" type="range" min="0" max="4000" step="1" class="mt-3 w-full md:w-1/2 accent-indigo-600" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Sale Price ($)</span>
          <input id="sale" type="text" inputmode="numeric" value="2,000,000" class="mt-1 w-full rounded-lg border border-gray-300 p-3" />
          <input id="saleSlider" type="range" min="0" max="4000" step="1" class="mt-3 w-full md:w-1/2 accent-indigo-600" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Length of ownership</span>
          <select id="holding" class="mt-1 w-full rounded-lg border border-gray-300 p-3">
            <option value="lt">Less than 1 year (short-term)</option>
            <option value="gt" selected>1 year or more (long-term)</option>
          </select>
        </label>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <label class="block">
          <span class="text-sm font-medium">Annual income ($)</span>
          <input id="income" type="text" inputmode="numeric" value="75,000" class="mt-1 w-full rounded-lg border border-gray-300 p-3" />
          <input id="incomeSlider" type="range" min="0" max="1000" step="1" class="mt-3 w-full md:w-1/2 accent-indigo-600" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Filing status</span>
          <select id="status" class="mt-1 w-full rounded-lg border border-gray-300 p-3">
            <option value="single">Single</option>
            <option value="married_joint">Married filing jointly</option>
          </select>
        </label>
        <label class="block">
          <span class="text-sm font-medium">State</span>
          <select id="state" class="mt-1 w-full rounded-lg border border-gray-300 p-3">
            <option value="none">Select state</option>
            <option value="AL">Alabama</option>
            <option value="AK">Alaska</option>
            <option value="AZ">Arizona</option>
            <option value="AR">Arkansas</option>
            <option value="CA">California</option>
            <option value="CO">Colorado</option>
            <option value="CT">Connecticut</option>
            <option value="DE">Delaware</option>
            <option value="DC">District of Columbia</option>
            <option value="FL">Florida</option>
            <option value="GA">Georgia</option>
            <option value="HI">Hawaii</option>
            <option value="ID">Idaho</option>
            <option value="IL">Illinois</option>
            <option value="IN">Indiana</option>
            <option value="IA">Iowa</option>
            <option value="KS">Kansas</option>
            <option value="KY">Kentucky</option>
            <option value="LA">Louisiana</option>
            <option value="ME">Maine</option>
            <option value="MD">Maryland</option>
            <option value="MA">Massachusetts</option>
            <option value="MI">Michigan</option>
            <option value="MN">Minnesota</option>
            <option value="MS">Mississippi</option>
            <option value="MO">Missouri</option>
            <option value="MT">Montana</option>
            <option value="NE">Nebraska</option>
            <option value="NV">Nevada</option>
            <option value="NH">New Hampshire</option>
            <option value="NJ">New Jersey</option>
            <option value="NM">New Mexico</option>
            <option value="NY">New York</option>
            <option value="NC">North Carolina</option>
            <option value="ND">North Dakota</option>
            <option value="OH">Ohio</option>
            <option value="OK">Oklahoma</option>
            <option value="OR">Oregon</option>
            <option value="PA">Pennsylvania</option>
            <option value="RI">Rhode Island</option>
            <option value="SC">South Carolina</option>
            <option value="SD">South Dakota</option>
            <option value="TN">Tennessee</option>
            <option value="TX">Texas</option>
            <option value="UT">Utah</option>
            <option value="VT">Vermont</option>
            <option value="VA">Virginia</option>
            <option value="WA">Washington</option>
            <option value="WV">West Virginia</option>
            <option value="WI">Wisconsin</option>
            <option value="WY">Wyoming</option>
          </select>
        </label>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="rounded-xl border bg-gray-50 p-6 text-center">
          <div class="text-sm text-gray-500 mb-1">Lump Sum Post-Tax Take-Home</div>
          <div id="lumpSumTakeHome" class="text-3xl font-semibold">$0</div>
        </div>
        <div class="rounded-xl border bg-gray-50 p-6 text-center">
          <div class="text-sm text-gray-500 mb-1">Installment Sale Post-Tax Take-Home</div>
          <div id="installmentTakeHome" class="text-3xl font-semibold">$0</div>
        </div>
      </div>

      <details class="rounded-xl border p-5 bg-slate-50/60">
        <summary class="cursor-pointer font-semibold">Installment Sale Options</summary>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
          <label class="block">
            <span class="text-sm font-medium">Years (min 2)</span>
            <input id="instYears" type="number" min="2" max="30" step="1" value="10" class="mt-1 w-full rounded-lg border border-gray-300 p-3" />
          </label>
          <label class="block">
            <span class="text-sm font-medium">Interest rate (%)</span>
            <input id="instRate" type="number" min="0" max="30" step="0.1" value="5.0" class="mt-1 w-full rounded-lg border border-gray-300 p-3" />
          </label>
        </div>

        <div class="mt-4">
          <button id="togglePreview" class="text-sm underline text-indigo-700">Show year-by-year preview</button>
          <div id="previewWrap" class="mt-3 hidden overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead>
                <tr class="text-left text-gray-600 border-b">
                  <th class="py-2 pr-4">Year</th>
                  <th class="py-2 pr-4">Payment</th>
                  <th class="py-2 pr-4">Interest (tax)</th>
                  <th class="py-2 pr-4">Principal (tax)</th>
                  <th class="py-2 pr-4">Basis Recov.</th>
                  <th class="py-2 pr-4">Gain Recog.</th>
                  <th class="py-2 pr-4">Taxes</th>
                  <th class="py-2 pr-4">After-Tax Cash</th>
                </tr>
              </thead>
              <tbody id="previewBody"></tbody>
            </table>
          </div>
        </div>
      </details>
    </section>
  </main>
</body>
</html>
